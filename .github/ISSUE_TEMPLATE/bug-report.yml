name: Bug
description: Report an issue to help improve this project
title: '[BUG]: '
labels: ['bug']
body:
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Has this bug been raised before?
      description: |
        Please do your part by looking though our [issues](/issues).
      options:
        - label: |
            I have checked "open" **AND** "closed" aforementioned issues and this will not be a duplicate!
          required: true
  - type: markdown
    attributes:
      value: |
        Please fill out the sections below to help everyone identify and fix the bug.
  - type: textarea
    id: description
    attributes:
      label: Describe your issue.
      placeholder: Be as descriptive as possible
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce the issue.
      placeholder: |
        1. Click on this button
        2. Wait for response
        3. Get an error
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: What device was this error on?
      multiple: true
      options: ['browser', 'mobile', 'tablet', 'tv', 'other']
      default: [0]
    validations:
      required: true
